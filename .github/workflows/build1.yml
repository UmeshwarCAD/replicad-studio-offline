name: Download Latest brepjs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-brepjs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get latest brepjs version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BREPJS_VERSION="$(npm view brepjs version)"
          OCCT_VERSION="$(npm view occt-wasm version)"

          echo "brepjs=$BREPJS_VERSION" >> "$GITHUB_OUTPUT"
          echo "occt=$OCCT_VERSION" >> "$GITHUB_OUTPUT"

          echo "Latest brepjs: $BREPJS_VERSION"
          echo "Latest occt-wasm: $OCCT_VERSION"

      - name: Create download directory
        run: |
          rm -rf brepjs-package
          mkdir -p brepjs-package

      - name: Download latest brepjs
        shell: bash
        run: |
          set -euo pipefail

          npm pack brepjs@latest --pack-destination brepjs-package
          tar -xzf brepjs-package/brepjs-*.tgz \
            -C brepjs-package

      - name: Download latest occt-wasm
        shell: bash
        run: |
          set -euo pipefail

          npm pack occt-wasm@latest --pack-destination brepjs-package
          tar -xzf brepjs-package/occt-wasm-*.tgz \
            -C brepjs-package

      - name: Create package.json
        shell: bash
        run: |
          cat > brepjs-package/package.json <<EOF
          {
            "name": "brepjs-android-bundle",
            "private": true,
            "description": "Latest brepjs and occt-wasm bundle",
            "brepjs": "${{ steps.version.outputs.brepjs }}",
            "occt-wasm": "${{ steps.version.outputs.occt }}"
          }
          EOF

      - name: Create version information
        shell: bash
        run: |
          cat > brepjs-package/VERSIONS.txt <<EOF
          brepjs: ${{ steps.version.outputs.brepjs }}
          occt-wasm: ${{ steps.version.outputs.occt }}

          Downloaded: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Source:
          https://www.npmjs.com/package/brepjs
          https://www.npmjs.com/package/occt-wasm
          EOF

      - name: Remove npm archives
        run: |
          find brepjs-package -name "*.tgz" -delete

      - name: Create ZIP
        shell: bash
        run: |
          zip -r \
            "brepjs-${{ steps.version.outputs.brepjs }}-android.zip" \
            brepjs-package

      - name: Upload brepjs ZIP
        uses: actions/upload-artifact@v4
        with:
          name: brepjs-${{ steps.version.outputs.brepjs }}-android
          path: brepjs-${{ steps.version.outputs.brepjs }}-android.zip
          retention-days: 90

      - name: Show package information
        run: |
          echo "======================================"
          echo "brepjs:    ${{ steps.version.outputs.brepjs }}"
          echo "occt-wasm: ${{ steps.version.outputs.occt }}"
          echo "======================================"
          ls -lh "brepjs-${{ steps.version.outputs.brepjs }}-android.zip"
