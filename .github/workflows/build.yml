name: Build Replicad Studio

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Replicad Latest
        run: git clone https://github.com/sgenoud/replicad.git temp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and Build
        working-directory: temp
        run: |
          npm install
          npm run build --workspace=studio
          ls -lh packages/studio/dist/

      - name: Upload Studio Files
        uses: actions/upload-artifact@v4
        with:
          name: replicad-studio-dist
          path: temp/packages/studio/dist/
